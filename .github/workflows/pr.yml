name: PR Check
on:
    pull_request:
        branches:
            - main
jobs:
    check-pr:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v3
              with:
                node-version: 22.x
                cache: 'npm'
            - run: npm ci
            - run: npm run test
            - run: npm run lint